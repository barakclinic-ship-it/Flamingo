<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flamingo</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', sans-serif; background: #f5eaee; color: #2e1a20; min-height: 100vh; }

header { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 20px 16px; border-bottom: 1px solid #e0b8c4; background: #fff; }
header img { height: 52px; }
header .brand { font-family: 'DM Sans', sans-serif; font-size: 13px; color: #a04060; letter-spacing: .22em; text-transform: uppercase; }

.wrap { max-width: 860px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; display: flex; flex-direction: column; gap: 1.25rem; }

.card { background: #fff; border: 1.5px solid #d4a0b0; border-radius: 18px; overflow: hidden; }

/* ── Card 1: image + side controls ── */
#main-card { display: flex; min-height: 320px; }

/* image side */
#img-side {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s; position: relative;
  border-left: 1.5px solid #e0b8c4;
}
#img-side:not(.has-image):hover { background: #fcedf1; }
#img-side.has-image { cursor: default; align-items: stretch; }

.dz-inner { text-align: center; padding: 2.5rem 1.5rem; }
.dz-inner .arrow { font-size: 32px; color: #b85070; display: block; margin-bottom: 10px; }
.dz-inner .t { font-size: 15px; color: #4a2038; }
.dz-inner .s { font-size: 12px; color: #a07888; margin-top: 4px; letter-spacing: .04em; }

#compare-inner { position: relative; width: 100%; display: none; direction: ltr; user-select: none; flex: 1; }
#compare-inner.show { display: flex; flex-direction: column; }
#compare-inner canvas { display: block; width: 100%; height: 100%; object-fit: contain; flex: 1; }
#sline { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; cursor: ew-resize; left: 50%; transform: translateX(-50%); box-shadow: 0 0 8px rgba(220,100,120,.3); }
#shandle { position: absolute; top: 50%; width: 36px; height: 36px; background: #fff; border-radius: 50%; transform: translate(-50%,-50%); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(220,100,120,.2); font-size: 15px; color: #b05068; cursor: ew-resize; border: 1px solid #d4a0b0; }
.clabel { position: absolute; top: 10px; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); color: #6a4055; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; pointer-events: none; border: 1px solid #d4a0b0; }
#cll { left: 10px; }
#clr { right: 10px; }

.img-topbar { position: absolute; top: 8px; right: 8px; z-index: 5; display: none; gap: 6px; }
.img-topbar.show { display: flex; }
.topbar-btn { background: rgba(255,255,255,.88); backdrop-filter: blur(4px); border: 1px solid #d4a0b0; border-radius: 20px; padding: 4px 12px; font-size: 11px; color: #6a4055; cursor: pointer; font-family: inherit; }
.topbar-btn:hover { border-color: #b84060; color: #b84060; }

/* controls side */
#ctrl-side {
  width: 230px; flex-shrink: 0; display: none;
  flex-direction: column; padding: 1.1rem 1.1rem 1.1rem; overflow-y: auto;
  border-radius: 0 18px 18px 0;
}
#ctrl-side.show { display: flex; }

.section-label { font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: #906070; font-weight: 500; margin-bottom: .6rem; }
hr.div { border: none; border-top: 1px solid #e0b8c4; margin: .85rem 0; }

/* Slider rows with editable number */
.slider-row { display: flex; align-items: center; gap: 6px; margin-bottom: .45rem; }
.slider-row:last-child { margin-bottom: 0; }
.slbl { font-size: 12px; color: #5a3048; min-width: 54px; text-align: right; flex-shrink: 0; }
input[type=range] { flex: 1; height: 2px; -webkit-appearance: none; outline: none; cursor: pointer; border-radius: 2px; background: #d4a0b0; min-width: 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #c4607a; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(220,100,120,.4); cursor: pointer; }

/* Photoshop-style number input */
.num-input {
  width: 42px; flex-shrink: 0;
  border: 1px solid #d4a0b0; border-radius: 6px;
  font-size: 11px; font-weight: 500; color: #b05068;
  text-align: center; padding: 2px 3px;
  background: #fff; outline: none; font-family: inherit;
  cursor: ns-resize;
}
.num-input:focus { border-color: #c4607a; cursor: text; }

.pills { display: flex; gap: 5px; flex-wrap: wrap; }
.pill { padding: 5px 12px; font-size: 12px; border: 1.5px solid #d4a0b0; border-radius: 20px; background: #fff; cursor: pointer; color: #6a4055; transition: all .13s; font-family: inherit; }
.pill:hover { border-color: #b84060; color: #b84060; }
.pill.on { background: #c4607a; color: #fff; border-color: #c4607a; }
.pill.off { opacity: .35; pointer-events: none; }
.scale-meta { font-size: 10px; color: #a07888; margin-top: .3rem; }

.tog-row { display: flex; align-items: center; gap: 8px; }
.tog { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
.tog input { opacity: 0; width: 0; height: 0; }
.track { position: absolute; inset: 0; background: #d0a0b0; border-radius: 18px; cursor: pointer; transition: background .2s; }
.track:before { content:''; position:absolute; width:12px; height:12px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s; }
.tog input:checked + .track { background: #c4607a; }
.tog input:checked + .track:before { transform: translateX(16px); }
.tog-lbl { font-size: 12px; color: #3a1830; }
.tog-sub { font-size: 10px; color: #a07888; margin-top: 1px; }

.warn { font-size: 11px; background: #fff8f0; border: 1px solid #ffd0a0; border-radius: 7px; padding: 5px 10px; color: #8a5020; margin-top: .5rem; display: none; }

.actions { display: flex; flex-direction: column; gap: 7px; margin-top: auto; padding-top: .85rem; }
.btn-main { background: #c4607a; color: #fff; border: none; padding: 10px; border-radius: 28px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background .15s; width: 100%; }
.btn-main:hover { background: #b05068; }
.btn-main:disabled { opacity: .45; cursor: not-allowed; }
.btn-dl { background: #fff; color: #6a4055; border: 1.5px solid #d4a0b0; padding: 9px; border-radius: 28px; font-size: 12px; cursor: pointer; display: none; font-family: inherit; width: 100%; text-align: center; }
.btn-dl:hover { border-color: #c4607a; color: #c4607a; }
.btn-dl.show { display: block; }
.btn-reset { background: none; border: none; font-size: 11px; color: #a07888; cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline; text-align: center; }
.btn-reset:hover { color: #b05068; }

#prog-wrap { display: none; margin-top: .5rem; }
#prog-bar { height: 3px; background: #e0b8c4; border-radius: 3px; overflow: hidden; }
#prog-fill { height: 100%; width: 0%; background: #c4607a; transition: width .1s; border-radius: 3px; }
#prog-lbl { font-size: 10px; color: #a07888; margin-top: 3px; }
</style>
</head>

      <div class="slider-row"><span class="slbl">ניגודיות</span><input type="range" id="ct" min="-100" max="100" value="0"><input class="num-input" id="ct-n" type="number" min="-100" max="100" value="0"></div>

<input type="file" id="fi" accept="image/*,.tif,.tiff,.heic,.heif,.bmp,.gif,.webp" style="display:none">
<canvas id="oc" style="display:none"></canvas>
<canvas id="pc" style="display:none"></canvas>

<script>
const MAX=15000, g=id=>document.getElementById(id);
let origImg=null, scale=1, resultBlob=null, sliderPct=50, dragging=false, rafId=null, hasResult=false, resultCanvas=null;

const imgSide=g('img-side');
imgSide.addEventListener('dragover',e=>{e.preventDefault();if(!origImg)imgSide.style.background='#fcedf1';});
imgSide.addEventListener('dragleave',()=>imgSide.style.background='');
imgSide.addEventListener('drop',e=>{e.preventDefault();imgSide.style.background='';load(e.dataTransfer.files[0]);});
g('fi').addEventListener('change',e=>load(e.target.files[0]));
function handleImgClick(e){ if(!origImg) g('fi').click(); }

function load(file){
  if(!file) return;
  const name = file.name.toLowerCase();
  const isHeic = name.endsWith('.heic') || name.endsWith('.heif') || file.type==='image/heic' || file.type==='image/heif';

  if(isHeic){
    alert('קבצי HEIC לא נתמכים ישירות בדפדפן.\n\nהמר ל-JPG/PNG תחילה:\n• Mac: פתח ב-Preview → ייצא כ-JPG\n• iPhone: הגדרות → מצלמה → פורמטים → הכי תואם\n• אונליין: heictojpg.com');
    return;
  }

  // Use createObjectURL + Image — works for JPG, PNG, WEBP, BMP, GIF
  // For TIFF: try via createImageBitmap (supported in Chrome 77+)
  const url = URL.createObjectURL(file);
  const isTiff = name.endsWith('.tif') || name.endsWith('.tiff') || file.type==='image/tiff';

  if(isTiff && typeof createImageBitmap !== 'undefined'){
    fetch(url).then(r=>r.blob()).then(blob=>createImageBitmap(blob)).then(bmp=>{
      URL.revokeObjectURL(url);
      const tmp=document.createElement('canvas');
      tmp.width=bmp.width; tmp.height=bmp.height;
      tmp.getContext('2d').drawImage(bmp,0,0);
      tmp.toBlob(b=>{
        const u2=URL.createObjectURL(b);
        const i=new Image();
        i.onload=()=>{ URL.revokeObjectURL(u2); applyImage(i); };
        i.src=u2;
      },'image/png');
    }).catch(()=>{
      alert('TIFF לא נתמך בדפדפן זה. המר ל-JPG/PNG תחילה.');
      URL.revokeObjectURL(url);
    });
    return;
  }

  const i = new Image();
  i.onload = () => { URL.revokeObjectURL(url); applyImage(i); };
  i.onerror = () => { URL.revokeObjectURL(url); alert('פורמט לא נתמך — נסה JPG או PNG.'); };
  i.src = url;
}

function applyImage(i){
  origImg=i;
  const oc=g('oc'); oc.width=i.width; oc.height=i.height;
  oc.getContext('2d').drawImage(i,0,0);
  hasResult=false; resultBlob=null; resultCanvas=null;
  g('db').classList.remove('show');
  g('compare-inner').classList.remove('show');
  g('dz-inner').style.display='none';
  imgSide.classList.add('has-image');
  g('topbar').classList.add('show');
  g('ctrl-side').classList.add('show');
  updScale(); schedulePreview();
}

// ── Slider ↔ number input sync ─────────────────────────────
const pairs=[['sh','sh-n'],['br','br-n'],['ct','ct-n'],['sat','sat-n'],['bgs','bgs-n']];
pairs.forEach(([rid,nid])=>{
  const range=g(rid), num=g(nid);
  if(!num) return;

  function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

  range.addEventListener('input',()=>{
    num.value=range.value;
    schedulePreview();
  });

  // Type to set value
  num.addEventListener('change',()=>{
    const v=clamp(parseFloat(num.value)||0, parseFloat(range.min), parseFloat(range.max));
    num.value=v; range.value=v;
    schedulePreview();
  });
  num.addEventListener('keydown',e=>{
    if(e.key==='Enter'){num.blur();schedulePreview();}
  });
  num.addEventListener('wheel',e=>{
    e.preventDefault();
    const v=clamp(Math.round(parseFloat(range.value)-(e.deltaY>0?1:-1)), parseFloat(range.min), parseFloat(range.max));
    num.value=v; range.value=v;
    schedulePreview();
  },{passive:false});

  // Photoshop-style drag on number: mousedown + mousemove changes value
  let dragStart=null, dragVal=null, didDrag=false;
  num.addEventListener('mousedown',e=>{
    if(document.activeElement===num) return; // already in text mode — don't intercept
    dragStart=e.clientY; dragVal=parseFloat(range.value); didDrag=false;
    const onMove=mv=>{
      const delta=dragStart-mv.clientY;
      if(!didDrag && Math.abs(delta)<3) return; // dead zone
      didDrag=true;
      const v=clamp(Math.round(dragVal+delta), parseFloat(range.min), parseFloat(range.max));
      num.value=v; range.value=v;
      schedulePreview();
    };
    const onUp=()=>{
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      if(!didDrag) num.focus(); // no drag → treat as click → enter text mode
    };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
});

g('bg').addEventListener('change',()=>{
  g('bgl').textContent=g('bg').checked?'פעיל':'כבוי';
  g('sens-wrap').style.display=g('bg').checked?'block':'none';
  schedulePreview();
});

// Reset
function doReset(){
  [['sh','sh-n'],['br','br-n'],['ct','ct-n'],['sat','sat-n']].forEach(([r,n])=>{g(r).value=0;if(g(n))g(n).value=0;});
  schedulePreview();
}
g('reset-btn').addEventListener('click',doReset);

// ── Live preview ───────────────────────────────────────────
function schedulePreview(){
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(doPreview);
}

function doPreview(){
  if(!origImg) return;
  const pc=g('pc'); pc.width=origImg.width; pc.height=origImg.height;
  const ctx=pc.getContext('2d');
  const brVal=parseInt(g('br').value), ctVal=parseInt(g('ct').value), satVal=parseInt(g('sat').value);
  const shVal=parseInt(g('sh').value), doBg=g('bg').checked, bgThresh=parseInt(g('bgs').value);

  ctx.filter=`brightness(${100+brVal}%) contrast(${100+ctVal}%) saturate(${100+satVal}%)`;
  ctx.drawImage(origImg,0,0);
  ctx.filter='none';

  if(shVal>0){
    let id=ctx.getImageData(0,0,pc.width,pc.height);
    id=fastUSM(id, shVal/100*1.8);
    ctx.putImageData(id,0,0);
  }

  if(doBg){
    let id=ctx.getImageData(0,0,pc.width,pc.height);
    id=removeBg(id,bgThresh);
    ctx.putImageData(id,0,0);
  }

  if(hasResult){
    resultCanvas=document.createElement('canvas');
    resultCanvas.width=pc.width; resultCanvas.height=pc.height;
    resultCanvas.getContext('2d').drawImage(pc,0,0);
    drawCompare();
  } else {
    const cc=g('comp-canvas'); cc.width=pc.width; cc.height=pc.height;
    cc.getContext('2d').drawImage(pc,0,0);
    g('compare-inner').classList.add('show');
  }
}

function fastUSM(imageData,amt){
  const d=imageData.data,w=imageData.width,h=imageData.height,out=new Uint8ClampedArray(d);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
    const i=(y*w+x)*4;
    for(let c=0;c<3;c++){const v=d[i+c],lap=4*v-d[((y-1)*w+x)*4+c]-d[((y+1)*w+x)*4+c]-d[(y*w+x-1)*4+c]-d[(y*w+x+1)*4+c];out[i+c]=Math.max(0,Math.min(255,v+amt*lap*0.5+.5|0));}
  }
  return new ImageData(out,w,h);
}

function removeBg(imageData,thresh){
  const d=imageData.data,w=imageData.width,h=imageData.height;
  const s=[[0,0],[w-1,0],[0,h-1],[w-1,h-1],[w>>1,0],[0,h>>1]];
  let br=0,bg=0,bb=0;
  for(const [x,y] of s){const i=(y*w+x)*4;br+=d[i];bg+=d[i+1];bb+=d[i+2];}
  br=br/s.length+.5|0;bg=bg/s.length+.5|0;bb=bb/s.length+.5|0;
  const out=new ImageData(new Uint8ClampedArray(d),w,h),vis=new Uint8Array(w*h),q=[];
  function en(x,y){if(x>=0&&x<w&&y>=0&&y<h&&!vis[y*w+x]){vis[y*w+x]=1;q.push(y*w+x);}}
  en(0,0);en(w-1,0);en(0,h-1);en(w-1,h-1);
  while(q.length){const idx=q.shift(),x=idx%w,y=idx/w|0,pi=idx*4;
    if(Math.abs(d[pi]-br)+Math.abs(d[pi+1]-bg)+Math.abs(d[pi+2]-bb)<thresh){out.data[pi+3]=0;en(x-1,y);en(x+1,y);en(x,y-1);en(x,y+1);}}
  return out;
}

// ── Scale ──────────────────────────────────────────────────
document.querySelectorAll('.pill').forEach(b=>{
  b.addEventListener('click',()=>{scale=parseInt(b.dataset.s);document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));b.classList.add('on');updScale();});
});
function updScale(){
  if(!origImg) return;
  const dw=origImg.width*scale,dh=origImg.height*scale,big=scale>1&&(dw>MAX||dh>MAX);
  if(scale===1){g('si').textContent=origImg.width+'×'+origImg.height;g('wb').style.display='none';g('rb').disabled=false;}
  else if(big){g('si').textContent=dw+'×'+dh;g('wb').style.display='block';g('wb').textContent='חורג מלימיט הדפדפן ('+MAX+'px)';g('rb').disabled=true;}
  else{g('si').textContent=origImg.width+'×'+origImg.height+' → '+dw+'×'+dh;g('wb').style.display='none';g('rb').disabled=false;}
}

// ── Compare ────────────────────────────────────────────────
function drawCompare(){
  const cc=g('comp-canvas'),src=resultCanvas||g('pc');
  cc.width=src.width; cc.height=src.height;
  const ctx=cc.getContext('2d'),dw=cc.width,dh=cc.height,sx=Math.round(dw*sliderPct/100);
  ctx.clearRect(0,0,dw,dh);
  ctx.save();ctx.beginPath();ctx.rect(0,0,sx,dh);ctx.clip();
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(g('oc'),0,0,g('oc').width,g('oc').height,0,0,dw,dh);ctx.restore();
  ctx.save();ctx.beginPath();ctx.rect(sx,0,dw-sx,dh);ctx.clip();
  ctx.drawImage(src,0,0,dw,dh);ctx.restore();
  g('sline').style.left=sliderPct+'%';
  g('compare-inner').classList.add('show');
}

function getPct(cx){const r=g('compare-inner').getBoundingClientRect();return Math.max(2,Math.min(98,(cx-r.left)/r.width*100));}
g('sline').addEventListener('mousedown',e=>{e.preventDefault();dragging=true;});
g('compare-inner').addEventListener('mousedown',e=>{if(hasResult){dragging=true;sliderPct=getPct(e.clientX);drawCompare();}});
document.addEventListener('mousemove',e=>{if(dragging){sliderPct=getPct(e.clientX);drawCompare();}});
document.addEventListener('mouseup',()=>dragging=false);
g('sline').addEventListener('touchstart',e=>{e.preventDefault();dragging=true;},{passive:false});
document.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();sliderPct=getPct(e.touches[0].clientX);drawCompare();}},{passive:false});
document.addEventListener('touchend',()=>dragging=false);

// ── Produce ────────────────────────────────────────────────
const WK=`
function sinc(x){return x===0?1:Math.sin(Math.PI*x)/(Math.PI*x);}
function lk(x,a){return Math.abs(x)<a?sinc(x)*sinc(x/a):0;}
function lscale(sd,sw,sh,dw,dh){const dd=new Uint8ClampedArray(dw*dh*4),a=3;for(let y=0;y<dh;y++)for(let x=0;x<dw;x++){const gx=(x+.5)/dw*sw-.5,gy=(y+.5)/dh*sh-.5;let r=0,g=0,b=0,al=0,wt=0;for(let ky=Math.floor(gy)-a+1;ky<=Math.floor(gy)+a;ky++){const wy=lk(gy-ky,a);for(let kx=Math.floor(gx)-a+1;kx<=Math.floor(gx)+a;kx++){const w=wy*lk(gx-kx,a),sx=Math.max(0,Math.min(sw-1,kx)),sy=Math.max(0,Math.min(sh-1,ky)),si=(sy*sw+sx)*4;r+=sd[si]*w;g+=sd[si+1]*w;b+=sd[si+2]*w;al+=sd[si+3]*w;wt+=w;}}const di=(y*dw+x)*4;dd[di]=Math.max(0,Math.min(255,r/wt+.5|0));dd[di+1]=Math.max(0,Math.min(255,g/wt+.5|0));dd[di+2]=Math.max(0,Math.min(255,b/wt+.5|0));dd[di+3]=Math.max(0,Math.min(255,al/wt+.5|0));}return dd;}
self.onmessage=function(e){const{px,sw,sh,dw,dh}=e.data;self.postMessage({t:'p',v:10,l:'מגדיל...'});const out=lscale(px,sw,sh,dw,dh);self.postMessage({t:'p',v:100,l:'הושלם!'});self.postMessage({t:'d',px:out,dw,dh},[out.buffer]);};`;

g('rb').addEventListener('click',()=>{
  if(!origImg) return;
  const pc=g('pc'); if(!pc.width) doPreview();
  const sw=pc.width,sh=pc.height,dw=sw*scale,dh=sh*scale;
  g('rb').disabled=true;g('prog-wrap').style.display='block';g('prog-fill').style.width='2%';g('db').classList.remove('show');

  if(scale===1){
    resultCanvas=document.createElement('canvas');
    resultCanvas.width=sw;resultCanvas.height=sh;
    resultCanvas.getContext('2d').drawImage(pc,0,0);
    finalize(); return;
  }

  const px=new Uint8ClampedArray(pc.getContext('2d').getImageData(0,0,sw,sh).data);
  const blob=new Blob([WK],{type:'application/javascript'}),wu=URL.createObjectURL(blob),wk=new Worker(wu);
  wk.onmessage=ev=>{
    const m=ev.data;
    if(m.t==='p'){g('prog-fill').style.width=m.v+'%';g('prog-lbl').textContent=m.l;}
    else if(m.t==='d'){
      resultCanvas=document.createElement('canvas');
      resultCanvas.width=m.dw;resultCanvas.height=m.dh;
      resultCanvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(m.px),m.dw,m.dh),0,0);
      finalize(); wk.terminate(); URL.revokeObjectURL(wu);
    }
  };
  wk.postMessage({px,sw,sh,dw,dh},[px.buffer]);
});

function finalize(){
  hasResult=true; sliderPct=50; drawCompare();
  resultCanvas.toBlob(b=>{
    resultBlob=b; g('db').classList.add('show');
    setTimeout(()=>{g('prog-wrap').style.display='none';g('prog-fill').style.width='0%';},400);
    g('rb').disabled=false;
  },'image/png');
}

g('db').addEventListener('click',()=>{
  if(!resultBlob) return;
  const a=document.createElement('a');a.href=URL.createObjectURL(resultBlob);a.download='flamingo-enhanced.png';a.click();
});
</script>
